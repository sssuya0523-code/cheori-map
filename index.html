<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>철이맵 · 배송지도</title><style>body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:#f5f7fa;color:#182536}header{padding:12px;background:#fff;display:flex;gap:8px;flex-wrap:wrap;align-items:center}button,input{font:inherit;border-radius:9px;padding:9px;border:1px solid #b7c3d0}button{background:#fff;cursor:pointer}button.primary{background:#1671d9;color:white;border:0}#map{height:calc(100dvh - 175px);min-height:370px}.info{padding:8px 12px;font-size:13px;background:#fff}.panel{position:absolute;z-index:2;bottom:30px;left:12px;right:12px;max-width:400px;background:#fff;padding:12px;border-radius:12px;box-shadow:0 3px 16px #0003;display:none}.panel.show{display:block}.muted{color:#536273;font-size:13px}.dot{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:4px}.pill{font-size:13px;padding:6px}#setup{padding:16px;background:#fff}#setup input{width:min(95%,370px)}.hide{display:none}</style></head><body><header><strong>🚚 철이맵</strong><button id="follow" class="primary">📍 내 위치 추적</button><button id="sat">🛰️ 위성지도</button><button id="add">＋ 핀 추가</button><button id="export">기록 백업</button><label class="pill">핀: <span id="count">0</span></label></header><div class="info"><span class="dot" style="background:#9ca3af"></span>없음　<span class="dot" style="background:#e34c4c"></span>배송 예정　<span class="dot" style="background:#16a34a"></span>완료　<span id="status" class="muted">지도를 준비하세요.</span></div><section id="setup"><b>첫 실행 설정</b><p class="muted">카카오 개발자 사이트의 JavaScript 키를 입력하세요. 이 키는 이 기기의 브라우저에만 저장됩니다.</p><input id="key" placeholder="JavaScript 키"><button id="start" class="primary">지도 시작</button><p class="muted">북면 전체 건물 주소 데이터는 아직 연결되지 않았습니다. 우선 지도·GPS·핀 상태 기능을 시험하는 첫 버전입니다.</p></section><div id="map"></div><div class="panel" id="panel"><b id="pointTitle">선택한 위치</b><p class="muted" id="pointCoords"></p><div style="display:flex;gap:7px;flex-wrap:wrap"><button data-state="none">⚪ 없음</button><button data-state="todo">🔴 예정</button><button data-state="done">🟢 완료</button><button id="nav">🚗 카카오내비</button><button id="remove">삭제</button><button id="close">닫기</button></div></div><script>
const $=s=>document.querySelector(s);let map,markers=[],selected=null,watch=null,positionMarker=null,adding=false,satellite=false;let points=JSON.parse(localStorage.getItem('cheori-points')||'[]');const colors={none:'#9ca3af',todo:'#e34c4c',done:'#16a34a'};function save(){localStorage.setItem('cheori-points',JSON.stringify(points));$('#count').textContent=points.length}function icon(state){return new kakao.maps.MarkerImage('data:image/svg+xml;charset=UTF-8,'+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="34" height="42" viewBox="0 0 34 42"><path d="M17 2C8 2 2 9 2 18c0 11 15 22 15 22s15-11 15-22C32 9 26 2 17 2Z" fill="${colors[state]}" stroke="white" stroke-width="2"/><circle cx="17" cy="17" r="6" fill="white"/></svg>`),new kakao.maps.Size(34,42),{offset:new kakao.maps.Point(17,40)})}function render(){markers.forEach(m=>m.setMap(null));markers=[];points.forEach(p=>{const m=new kakao.maps.Marker({map,position:new kakao.maps.LatLng(p.lat,p.lng),image:icon(p.state)});kakao.maps.event.addListener(m,'click',()=>openPoint(p.id));markers.push(m)});save()}function openPoint(id){selected=points.find(p=>p.id===id);if(!selected)return;$('#pointTitle').textContent=selected.name||'배송지';$('#pointCoords').textContent=`${selected.lat.toFixed(6)}, ${selected.lng.toFixed(6)}`;$('#panel').classList.add('show')}function init(){map=new kakao.maps.Map($('#map'),{center:new kakao.maps.LatLng(36.827,127.26),level:7});map.addControl(new kakao.maps.ZoomControl(),kakao.maps.ControlPosition.RIGHT);kakao.maps.event.addListener(map,'click',e=>{if(!adding)return;adding=false;$('#add').textContent='＋ 핀 추가';const name=prompt('배송지 이름 또는 주소를 입력하세요','새 배송지');if(name===null)return;const p={id:Date.now()+Math.random(),name:name.trim()||'새 배송지',lat:e.latLng.getLat(),lng:e.latLng.getLng(),state:'none'};points.push(p);render();openPoint(p.id)});render();$('#setup').classList.add('hide');$('#status').textContent='핀 추가 버튼 → 지도 터치로 핀 등록 가능'}function start(){const key=$('#key').value.trim();if(!/^[a-zA-Z0-9]+$/.test(key)){alert('JavaScript 키를 확인해 주세요.');return}localStorage.setItem('cheori-js-key',key);const s=document.createElement('script');s.src='https://dapi.kakao.com/v2/maps/sdk.js?appkey='+encodeURIComponent(key)+'&autoload=false';s.onload=()=>kakao.maps.load(init);s.onerror=()=>alert('지도 SDK 로딩 실패: 키와 등록 도메인을 확인해 주세요.');document.head.appendChild(s)}$('#start').onclick=start;$('#key').value=localStorage.getItem('cheori-js-key')||'';$('#add').onclick=()=>{adding=!adding;$('#add').textContent=adding?'지도에서 위치 터치':'＋ 핀 추가'};document.querySelectorAll('[data-state]').forEach(b=>b.onclick=()=>{if(!selected)return;selected.state=b.dataset.state;render();$('#panel').classList.remove('show')});$('#close').onclick=()=>$('#panel').classList.remove('show');$('#remove').onclick=()=>{if(!selected||!confirm('이 핀을 삭제할까요?'))return;points=points.filter(p=>p.id!==selected.id);render();$('#panel').classList.remove('show')};$('#sat').onclick=()=>{if(!map)return;satellite=!satellite;map.setMapTypeId(satellite?kakao.maps.MapTypeId.HYBRID:kakao.maps.MapTypeId.ROADMAP);$('#sat').textContent=satellite?'🗺️ 일반지도':'🛰️ 위성지도'};$('#nav').onclick=()=>{if(!selected)return;location.href='https://map.kakao.com/link/to/'+encodeURIComponent(selected.name)+','+selected.lat+','+selected.lng};$('#follow').onclick=()=>{if(!map)return;if(!navigator.geolocation){alert('위치를 사용할 수 없는 브라우저입니다.');return}if(watch!==null){navigator.geolocation.clearWatch(watch);watch=null;$('#follow').textContent='📍 내 위치 추적';return}watch=navigator.geolocation.watchPosition(pos=>{const loc=new kakao.maps.LatLng(pos.coords.latitude,pos.coords.longitude);if(!positionMarker)positionMarker=new kakao.maps.Marker({map,position:loc,title:'내 위치'});else positionMarker.setPosition(loc);map.panTo(loc);$('#status').textContent='현재 위치 추적 중 · 정확도 약 '+Math.round(pos.coords.accuracy)+'m'},e=>{$('#status').textContent='위치 오류: '+e.message},{enableHighAccuracy:true,maximumAge:1000,timeout:15000});$('#follow').textContent='⏹ 위치 추적 중지'};$('#export').onclick=()=>{const blob=new Blob([JSON.stringify(points,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='cheori-map-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
</script></body></html>
